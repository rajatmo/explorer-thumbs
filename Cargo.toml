# Not buildable on its own: installer\package.ps1 builds it as a member of PdfCraft's workspace,
# which is where `workspace = true` below is resolved. See the README.
[package]
name = "pdfcraft-explorer-thumbs"
description = "Local add-on: first-page thumbnails of PDF files in Windows File Explorer"
# Versioned on its own: this add-on is installed and upgraded separately from PdfCraft.
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# The cdylib is pdfcraft_explorer_thumbs.dll, the handler File Explorer loads. The rlib lets the
# tests call the exported entry points directly.
crate-type = ["cdylib", "rlib"]

# Not `workspace = true`: the workspace forbids `unsafe`, and a File Explorer thumbnail handler is
# an in-process COM server (exported functions taking raw pointers, and a bitmap filled through
# one). `unsafe` stays denied everywhere except src/windows.rs, which allows it explicitly.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
pdfcraft-render = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The version already in the workspace's dependency graph.
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core = "0.62"
